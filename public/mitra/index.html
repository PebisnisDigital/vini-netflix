<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101511">
  <meta name="description" content="Semua panduan Mitra PESONAFLIX dalam satu rak kartu interaktif: jasa, demo web, benefit, komisi, cara jualan, alur pembayaran, dan FAQ.">
  <meta property="og:title" content="Panduan Mitra PESONAFLIX — Pilih Kartu, Pelajari Program">
  <meta property="og:description" content="Satu halaman, delapan kartu, semua penjelasan program Mitra PESONAFLIX.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pesonaflix.vercel.app/mitra">
  <link rel="canonical" href="https://pesonaflix.vercel.app/mitra">
  <title>Panduan Mitra PESONAFLIX — Rak Materi Interaktif</title>
  <style>
    :root {
      --ink: #111811;
      --paper: #f7f4ea;
      --red: #f45d50;
      --text: #f4f1e9;
      --line: rgba(255,255,255,.17);
      --font: Inter, "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: #101511; color: var(--text); font: 400 16px/1.55 var(--font); }
    body.modal-open { overflow: hidden; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid #ffc77d; outline-offset: 4px; }
    ::selection { background: #fda396; color: #1c1210; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* One section, one stage */
    .hero {
      position: relative; min-height: 100svh; isolation: isolate; overflow: hidden;
      background:
        radial-gradient(ellipse 43% 43% at 79% 31%, rgba(100,116,93,.24), transparent 80%),
        radial-gradient(ellipse 42% 51% at 13% 86%, rgba(129,54,47,.18), transparent 83%),
        linear-gradient(147deg, #151a16 0%, #0b110e 72%, #141a15 100%);
    }
    .hero::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .11;
      background-image: linear-gradient(to right, #fff 1px, transparent 1px), linear-gradient(to bottom, #fff 1px, transparent 1px);
      background-size: 82px 82px; mask-image: linear-gradient(90deg, transparent, #000 78%);
    }
    .glow { position: absolute; width: 480px; height: 480px; filter: blur(95px); border-radius: 50%; opacity: .12; pointer-events: none; }
    .glow.one { top: -250px; right: -170px; background: #d0d9ab; }
    .glow.two { bottom: -300px; left: -180px; background: #ef5146; }
    .shell { width: min(1140px, calc(100% - 48px)); min-height: 100svh; margin: auto; display: grid; place-items: center; padding: 42px 0; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { letter-spacing: -.06em; line-height: 1.06; }

    /* Rack and 3D cards */
    .rack-zone { position: relative; min-width: 0; width: 100%; }
    .rack {
      position: relative; border: 1px solid #364238; background: rgba(20,29,23,.68); border-radius: 29px;
      padding: 35px 32px 32px; box-shadow: inset 0 1px #ffffff0a, 0 30px 70px rgba(0,0,0,.28);
      perspective: 1400px; overflow: hidden;
    }
    .rack::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 47% 0%, #ffffff10, transparent 65%); }
    .rack-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); column-gap: 24px; row-gap: 43px; position: relative; z-index: 1; }
    .shelf { position: absolute; z-index: 0; left: 8px; right: 8px; height: 16px; border-radius: 0 0 12px 12px; background: linear-gradient(180deg,#4b594b 0%,#243127 42%,#101710 100%); border-top: 2px solid #788977; box-shadow: 0 11px 18px #0008; }
    .shelf.first { top: calc(50% - 14px); }
    .shelf.second { bottom: 15px; }
    .shelf.third, .shelf.fourth { display: none; }
    .rack-card {
      --tilt: -5deg; --a: #9d434c; --b: #2c2235; --c: #dc8370;
      min-width: 0; height: clamp(220px, 20vw, 285px); text-align: left; position: relative; padding: 0; border: 0; border-radius: 17px;
      background: transparent; color: white; transform-style: preserve-3d;
      transform: rotateY(var(--tilt)) rotateX(5deg) rotateZ(var(--roll, 0deg));
      filter: drop-shadow(8px 17px 12px rgba(0,0,0,.5));
      transition: transform .25s cubic-bezier(.2,.8,.2,1), filter .25s;
    }
    .rack-card:nth-child(even) { --tilt: 5deg; --roll: 1.4deg; }
    .rack-card:nth-child(3n) { --roll: -1.5deg; }
    .rack-card:hover, .rack-card:focus-visible { transform: translateY(-11px) rotateY(0) rotateX(0) rotateZ(0) scale(1.035); filter: drop-shadow(9px 25px 19px rgba(0,0,0,.62)); z-index: 4; }
    .rack-card::before { content: ""; position: absolute; left: -6px; top: 7px; bottom: 5px; width: 9px; border-radius: 5px 0 0 5px; background: linear-gradient(90deg,#100d0d,#79817555 70%,#ffffff59); transform: rotateY(-25deg); z-index: -1; }
    .card-face {
      position: absolute; inset: 0; border-radius: 17px; overflow: hidden; padding: 20px 19px 17px;
      display: flex; flex-direction: column; border: 1px solid #ffffff58;
      background: radial-gradient(circle at 80% 30%, var(--c) -20%, transparent 50%), linear-gradient(145deg,var(--a),var(--b) 88%);
      box-shadow: inset 3px 0 #ffffff38, inset 0 1px #ffffff5a;
    }
    .card-face::before { content: ""; width: 115%; aspect-ratio: 1; border: 1px solid #ffffff5c; border-radius: 50%; position: absolute; right: -58%; top: 8%; box-shadow: 0 0 0 23px #ffffff12, 0 0 0 51px #ffffff0c; pointer-events: none; }
    .card-face::after { content: ""; position: absolute; width: 72%; height: 95%; right: -30%; bottom: -45%; border: 1px solid #ffffff4f; transform: rotate(-25deg); border-radius: 45%; pointer-events: none; }
    .card-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; z-index: 1; font-size: 9px; font-weight: 900; letter-spacing: .09em; color: #ffffffde; }
    .card-top i { width: 18px; height: 18px; border: 1px solid #ffffff8a; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10px; }
    .card-symbol { font-size: clamp(59px,6vw,85px); font-weight: 800; letter-spacing: -.13em; line-height: 1; margin: auto 0 7px; opacity: .83; text-shadow: 0 5px 17px #0003; }
    .card-title { position: relative; z-index: 1; display: block; font-size: clamp(19px,2vw,28px); line-height: 1.08; font-weight: 900; letter-spacing: -.055em; max-width: 98%; }
    .card-bottom { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 9px; font-weight: 850; letter-spacing: .12em; opacity: .85; }
    .card-bottom .circle-arrow { width: 23px; height: 23px; border: 1px solid #ffffff91; border-radius: 50%; display: grid; place-items: center; font-size: 15px; letter-spacing: 0; }
    .rack-card:nth-child(1) { --a:#ac4051; --b:#432538; --c:#e17b69; }
    .rack-card:nth-child(2) { --a:#7566ad; --b:#35305e; --c:#a9a8e5; }
    .rack-card:nth-child(3) { --a:#607c5f; --b:#243d35; --c:#acc48d; }
    .rack-card:nth-child(4) { --a:#a86943; --b:#543a39; --c:#e3ab6d; }
    .rack-card:nth-child(5) { --a:#346a76; --b:#203e4a; --c:#75bfc2; }
    .rack-card:nth-child(6) { --a:#8a4969; --b:#3d2c50; --c:#dd91a4; }
    .rack-card:nth-child(7) { --a:#9f7742; --b:#4b4533; --c:#edc477; }
    .rack-card:nth-child(8) { --a:#4b6e64; --b:#253b42; --c:#a4b9ae; }

    /* Readable detail drawer */
    .detail-overlay { position: fixed; z-index: 100; inset: 0; display: flex; justify-content: flex-end; }
    .shade { position: absolute; inset: 0; background: rgba(4,9,6,.73); backdrop-filter: blur(10px); }
    .drawer {
      position: relative; height: 100dvh; width: min(600px, 100%); background: var(--paper); color: #172019;
      display: flex; flex-direction: column; border-left: 1px solid #ffffff8a; box-shadow: -30px 0 90px #0007;
      animation: drawer-in .28s cubic-bezier(.2,.8,.25,1) both;
    }
    @keyframes drawer-in { from { transform: translateX(55px); opacity: .6; } to { transform: translateX(0); opacity: 1; } }
    .drawer-header { flex: none; padding: 30px 38px 24px; border-bottom: 1px solid #d9ded5; }
    .drawer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .drawer-kicker { font-size: 11px; color: #c54d44; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
    .close-btn { width: 42px; height: 42px; background: #e6e9e2; color: #172019; border: 0; border-radius: 50%; display: grid; place-items: center; font-size: 25px; line-height: 1; transition: background .2s; }
    .close-btn:hover { background: #d3dcd0; }
    .drawer h2 { font-size: clamp(33px,4vw,50px); font-weight: 900; letter-spacing: -.06em; margin: 16px 0 0; }
    .drawer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 29px 38px 40px; scrollbar-color: #bfc8b9 transparent; }
    .lead { font-size: 18px; font-weight: 530; color: #4e5c51; line-height: 1.68; margin-bottom: 24px; }
    .lead strong { color: #142018; }
    .info-card { background: white; border: 1px solid #e0e5da; border-radius: 18px; padding: 22px; margin: 18px 0; }
    .info-card.soft { background: #e5ebde; }
    .info-card.warm { background: #f4e1d9; border-color: #ead1c5; }
    .info-card h3 { font-size: 20px; letter-spacing: -.045em; margin: 0 0 8px; }
    .info-card p { color: #526054; font-size: 15px; margin: 0; line-height: 1.7; }
    .keyline { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid #e1e5db; }
    .keyline:last-child { border-bottom: 0; }
    .keyline span { color: #647164; font-size: 14px; }
    .keyline strong { color: #1b271c; font-size: 18px; letter-spacing: -.045em; text-align: right; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .pill { border-radius: 99px; padding: 8px 12px; background: #e6e9e0; color: #324233; font-size: 12px; font-weight: 850; }
    .pill.red { background: #f9dbd4; color: #9c3029; }
    .hint { font-size: 13px; line-height: 1.6; color: #738070; margin: 18px 0 0; }
    .bullet-list { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 11px; }
    .bullet-list li { display: flex; gap: 13px; color: #465447; line-height: 1.65; }
    .bullet-list li::before { content: "✓"; flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: #d7e6d4; color: #1d4b28; font-weight: 900; font-size: 13px; margin-top: 2px; }
    .demo-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .demo-link { min-width: 0; background: #fff; border: 1px solid #dce2d8; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 9px; transition: transform .2s, border-color .2s; }
    .demo-link:hover { transform: translateY(-2px); border-color: #ce7669; }
    .demo-link small { color: #8d978b; font-size: 10px; font-weight: 900; letter-spacing: .1em; }
    .demo-link strong { color: #202c22; font-size: 17px; letter-spacing: -.04em; }
    .demo-link span { color: #bb4b41; font-size: 12px; font-weight: 850; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .benefit-list { display: grid; gap: 11px; }
    .benefit-item { display: grid; grid-template-columns: 39px 1fr; align-items: start; gap: 13px; border-bottom: 1px solid #dce2d9; padding: 12px 0 15px; }
    .benefit-item:last-child { border: 0; }
    .benefit-item b { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 12px; background: #e1e6da; color: #24422d; font-size: 18px; }
    .benefit-item h3 { font-size: 17px; letter-spacing: -.03em; margin: 0 0 4px; }
    .benefit-item p { margin: 0; font-size: 14px; color: #617064; line-height: 1.6; }
    .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-radius: 13px; background: #e4e8df; padding: 5px; margin-bottom: 21px; }
    .segment button { border: 0; background: transparent; color: #536353; border-radius: 10px; padding: 13px 8px; font-size: 13px; font-weight: 850; }
    .segment button[aria-pressed="true"] { background: #1c2a20; color: white; box-shadow: 0 5px 10px #1c2a2026; }
    .big-amount { font-size: clamp(52px,8vw,78px); font-weight: 950; letter-spacing: -.085em; line-height: 1; color: #c84c43; }
    .big-amount small { font-size: 14px; color: #7c867b; font-weight: 750; letter-spacing: 0; }
    .share-bar { height: 11px; background: #234333; border-radius: 30px; overflow: hidden; margin: 17px 0 9px; }
    .share-bar span { display: block; height: 100%; background: #f45d50; width: 50.25%; transition: width .25s; }
    .bar-legend { color: #667369; font-size: 12px; }
    .steps-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .steps-list li { display: grid; grid-template-columns: 40px 1fr; gap: 13px; align-items: start; padding: 16px; border: 1px solid #dde3d8; border-radius: 15px; background: white; }
    .steps-list .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #e6eadf; font-weight: 950; color: #3c5140; }
    .steps-list h3 { font-size: 17px; margin: 0 0 5px; letter-spacing: -.035em; }
    .steps-list p { font-size: 14px; color: #657066; margin: 0; line-height: 1.6; }
    .flow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .flow-box { padding: 20px; background: white; border: 1px solid #dce2d8; border-radius: 16px; }
    .flow-box h3 { font-size: 16px; letter-spacing: -.035em; margin: 0 0 14px; }
    .flow-box strong { display: block; font-size: 27px; color: #cf5548; line-height: 1; letter-spacing: -.065em; margin-bottom: 8px; }
    .flow-box p { font-size: 12px; color: #657166; line-height: 1.65; margin: 0; }
    details.faq-item { border-bottom: 1px solid #d4ddd3; padding: 18px 0; }
    details.faq-item summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; font-size: 16px; font-weight: 850; letter-spacing: -.03em; }
    details.faq-item summary::-webkit-details-marker { display: none; }
    details.faq-item summary::after { content: "+"; color: #ca4e42; font-size: 23px; line-height: 1; font-weight: 500; }
    details.faq-item[open] summary::after { content: "−"; }
    details.faq-item p { font-size: 14px; line-height: 1.7; color: #59675a; padding-right: 23px; margin: 12px 0 0; }
    .inline-open { border: 0; background: #1d3022; color: white; border-radius: 99px; padding: 12px 17px; font-weight: 800; font-size: 13px; }
    .inline-open:hover { background: #314a35; }
    .drawer-footer { flex: none; padding: 16px 38px 19px; border-top: 1px solid #d9dfd5; background: #f1f0e7; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .drawer-footer button { border: 1px solid #c9d4c8; background: white; color: #223126; border-radius: 99px; padding: 11px 17px; font-size: 13px; font-weight: 850; }
    .drawer-footer button:hover { background: #e5ebdf; }
    .drawer-footer span { color: #7d897b; font-size: 12px; font-weight: 900; white-space: nowrap; }

    @media (max-width: 1180px) {
      .rack { padding: 27px 22px 26px; }
      .rack-grid { gap: 34px 17px; }
      .rack-card { height: clamp(190px,23vw,265px); }
      .card-face { padding: 15px; }
      .card-title { font-size: clamp(18px,2.3vw,25px); }
    }
    @media (max-width: 940px) {
      .shell { width: min(760px, calc(100% - 40px)); }
      .rack-card { height: clamp(160px,24vw,225px); }
      .card-title { font-size: clamp(15px,2.5vw,22px); }
      .card-symbol { font-size: 61px; }
    }
    @media (max-width: 580px) {
      .shell { width: min(100% - 24px,520px); padding: 24px 0; }
      .rack { padding: 19px 14px 18px; border-radius: 22px; }
      .rack-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 24px 15px; }
      .rack-card { height: clamp(175px,56vw,234px); }
      .card-face { padding: 14px; }
      .card-title { font-size: clamp(18px,5vw,24px); }
      .card-symbol { font-size: 58px; }
      .shelf.first { top: calc(25% - 8px); }
      .shelf.second { top: calc(50% - 8px); bottom: auto; }
      .shelf.third { display: block; top: calc(75% - 8px); }
      .shelf.fourth { display: block; bottom: 15px; }
      .drawer { width: 100%; height: 94dvh; margin-top: auto; border-radius: 24px 24px 0 0; border-left: 0; animation: sheet-in .26s ease-out both; }
      @keyframes sheet-in { from { transform: translateY(35px); opacity: .75; } to { transform: translateY(0); opacity: 1; } }
      .drawer-header { padding: 21px 22px 19px; }
      .drawer h2 { font-size: 35px; margin: 12px 0 0; }
      .drawer-body { padding: 22px 22px 30px; }
      .drawer-footer { padding: 13px 18px calc(15px + env(safe-area-inset-bottom)); }
      .drawer-footer button { padding: 11px 12px; font-size: 12px; }
      .lead { font-size: 16px; }
      .flow-grid { grid-template-columns: 1fr; }
      .demo-list { gap: 8px; }
      .demo-link { padding: 12px; }
      .demo-link strong { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
      <div class="shell">
        <h1 class="sr-only" id="hero-title">Panduan Mitra PESONAFLIX — Pilih kartu untuk melihat materi</h1>

              </div>
            </div>
        </div>
      </div>

  <script>
    (function () {
      const cards = Array.from(document.querySelectorAll(".rack-card"));
      const overlay = document.getElementById("detail-overlay");
      const shade = document.getElementById("detail-shade");
      const closeButton = document.getElementById("close-detail");
      const title = document.getElementById("detail-title");
      const indexLabel = document.getElementById("detail-index");
      const progress = document.getElementById("detail-progress");
      const body = document.getElementById("detail-body");
      const prev = document.getElementById("prev-topic");
      const next = document.getElementById("next-topic");
      let activeIndex = 0;
      let returnFocus = null;

      function rupiah(n) { return "Rp" + new Intl.NumberFormat("id-ID").format(n); }
      function bindCommission() {
        const buttons = Array.from(body.querySelectorAll("[data-status]"));
        if (!buttons.length) return;
        function update(isRegistered) {
          const fee = isRegistered ? 100000 : 30000;
          const remainder = 199000 - fee;
          buttons.forEach(function (btn) {
            btn.setAttribute("aria-pressed", String((btn.dataset.status === "sudah") === isRegistered));
          });
          body.querySelector("#commission-value").textContent = rupiah(fee);
          body.querySelector("#commission-row").textContent = rupiah(fee);
          body.querySelector("#team-row").textContent = rupiah(remainder);
          body.querySelector("#commission-bar").style.width = (fee / 199000 * 100) + "%";
          body.querySelector("#commission-status-title").textContent = isRegistered ? "Khusus mitra yang sudah daftar" : "Khusus mitra yang belum daftar";
          body.querySelector("#commission-note").textContent = "Dari pembayaran Rp199.000, kamu ambil " + rupiah(fee) + " sebagai komisi. Sisanya " + rupiah(remainder) + " dikirimkan ke tim PESONAFLIX.";
        }
        buttons.forEach(function (btn) {
          btn.addEventListener("click", function () { update(btn.dataset.status === "sudah"); });
        });
      }
      function showIndex(i, initial) {
        activeIndex = (i + cards.length) % cards.length;
        const card = cards[activeIndex];
        const template = document.getElementById("topic-" + card.dataset.topic);
        const count = String(activeIndex + 1).padStart(2, "0");
        title.textContent = card.dataset.title;
        indexLabel.textContent = "MATERI " + count + " / 08";
        progress.textContent = count + " / 08";
        body.replaceChildren(template.content.cloneNode(true));
        body.scrollTop = 0;
        bindCommission();
        if (initial) closeButton.focus();
      }
      function openIndex(i) {
        if (overlay.hidden) returnFocus = document.activeElement;
        overlay.hidden = false;
        document.body.classList.add("modal-open");
        showIndex(i, true);
      }
      function close() {
        overlay.hidden = true;
        document.body.classList.remove("modal-open");
        if (returnFocus && typeof returnFocus.focus === "function") returnFocus.focus();
      }
      cards.forEach(function (card, i) { card.addEventListener("click", function () { openIndex(i); }); });
      closeButton.addEventListener("click", close);
      shade.addEventListener("click", close);
      prev.addEventListener("click", function () { showIndex(activeIndex - 1, false); });
      next.addEventListener("click", function () { showIndex(activeIndex + 1, false); });
      body.addEventListener("click", function (event) {
        const button = event.target.closest("[data-open-topic]");
        if (!button) return;
        const i = cards.findIndex(function (card) { return card.dataset.topic === button.dataset.openTopic; });
        if (i >= 0) showIndex(i, false);
      });
      document.addEventListener("keydown", function (event) {
        if (overlay.hidden) return;
        if (event.key === "Escape") { event.preventDefault(); close(); return; }
        if (event.key !== "Tab") return;
        const focusable = Array.from(overlay.querySelectorAll("button:not([disabled]), a[href], summary, [tabindex]:not([tabindex='-1'])")).filter(function (el) { return el.getClientRects().length > 0; });
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
    })();
  </script>
