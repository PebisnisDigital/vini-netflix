    .rack-row::before { content: ""; position: absolute; z-index: 3; top: 0; left: -22px; right: -22px; height: 13px; border-radius: 9px; background: linear-gradient(180deg,#a4b7a3 0%,#526552 20%,#2e4035 60%,#101d17 100%); border-top: 2px solid #d4e2ce; box-shadow: 0 7px 13px #0009, inset 0 -2px #0d170f; pointer-events: none; }

    .rack-card {
      --hang: -1.5deg; --a: #9d434c; --b: #2c2235; --c: #dc8370;
      min-width: 0; height: clamp(185px, 16vw, 215px); text-align: left; position: relative; padding: 0; border: 0; border-radius: 17px;
      background: transparent; color: white; transform-style: preserve-3d; transform-origin: 50% -25px;
      transform: rotateZ(var(--hang)) rotateY(-2deg);
      filter: drop-shadow(8px 17px 12px rgba(0,0,0,.5));
      transition: transform .4s ease-out, filter .4s ease-out;
    }
    .rack-card:nth-child(even) { --hang: 1.6deg; }
    .rack-card:nth-child(3n) { --hang: -.8deg; }
    .rack-card::before { content: ""; position: absolute; z-index: 4; top: -27px; left: calc(50% - 2px); height: 30px; width: 4px; border-radius: 3px; background: linear-gradient(90deg,#bacbbc,#556958 65%,#293e2d); box-shadow: 1px 1px 5px #0009; pointer-events: none; }

    .card-inner { position: absolute; inset: 0; display: block; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.16,.77,.22,1); }
    .card-face {
      position: absolute; inset: 0; border-radius: 17px; overflow: hidden; padding: 20px 19px 17px;
      display: flex; flex-direction: column; justify-content: center; border: 1px solid #ffffff58; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: radial-gradient(circle at 80% 30%, var(--c) -20%, transparent 50%), linear-gradient(145deg,var(--a),var(--b) 88%);

    .card-back { transform: rotateY(180deg); background: radial-gradient(circle at 20% 25%, var(--c) -35%,transparent 55%),linear-gradient(215deg,var(--a),var(--b) 88%); }
    .card-face::before { content: ""; width: 115%; aspect-ratio: 1; border: 1px solid #ffffff5c; border-radius: 50%; position: absolute; right: -58%; top: 8%; box-shadow: 0 0 0 23px #ffffff12, 0 0 0 51px #ffffff0c; pointer-events: none; }
    .card-back::before { right: auto; left: -58%; }
    .card-face::after { content: ""; position: absolute; width: 72%; height: 95%; right: -30%; bottom: -45%; border: 1px solid #ffffff4f; transform: rotate(-25deg); border-radius: 45%; pointer-events: none; }
    .card-title { position: relative; z-index: 1; display: block; font-size: clamp(26px,2.7vw,38px); line-height: 1.12; font-weight: 900; letter-spacing: -.055em; max-width: 100%; }
    @keyframes touch-swing { 0% { transform: rotateZ(var(--hang)) rotateY(-2deg); } 16% { transform: rotateZ(7deg) rotateY(6deg); } 38% { transform: rotateZ(-5deg) rotateY(-5deg); } 58% { transform: rotateZ(3.5deg) rotateY(3deg); } 78% { transform: rotateZ(-2deg) rotateY(-2deg); } 100% { transform: rotateZ(0) rotateY(0); } }

  <script>
    (function () {
      const cards = Array.from(document.querySelectorAll(".rack-card"));
      const overlay = document.getElementById("detail-overlay");
      const popup = overlay.querySelector(".drawer");
      const shade = document.getElementById("detail-shade");
      const closeButton = document.getElementById("close-detail");
      const title = document.getElementById("detail-title");
      const indexLabel = document.getElementById("detail-index");
      const progress = document.getElementById("detail-progress");
      const body = document.getElementById("detail-body");
      const prev = document.getElementById("prev-topic");
      const next = document.getElementById("next-topic");
      const totalLabel = String(cards.length).padStart(2, "0");
      let activeIndex = 0;
      let returnFocus = null;

      function rupiah(n) { return "Rp" + new Intl.NumberFormat("id-ID").format(n); }
      function bindCommission() {
        const buttons = Array.from(body.querySelectorAll("[data-status]"));
        if (!buttons.length) return;
        function update(isRegistered) {
          const fee = isRegistered ? 100000 : 30000;
          const remainder = 199000 - fee;
          buttons.forEach(function (btn) {
            btn.setAttribute("aria-pressed", String((btn.dataset.status === "sudah") === isRegistered));
          });
          body.querySelector("#commission-value").textContent = rupiah(fee);
          body.querySelector("#commission-row").textContent = rupiah(fee);
          body.querySelector("#team-row").textContent = rupiah(remainder);
          body.querySelector("#commission-bar").style.width = (fee / 199000 * 100) + "%";
          body.querySelector("#commission-status-title").textContent = isRegistered ? "Khusus mitra yang sudah daftar" : "Khusus mitra yang belum daftar";
          body.querySelector("#commission-note").textContent = "Dari pembayaran Rp199.000, kamu ambil " + rupiah(fee) + " sebagai komisi. Sisanya " + rupiah(remainder) + " dikirimkan ke tim PESONAFLIX.";
        }
        buttons.forEach(function (btn) {
          btn.addEventListener("click", function () { update(btn.dataset.status === "sudah"); });
        });
      }
      function showIndex(i, initial) {
        activeIndex = (i + cards.length) % cards.length;
        const card = cards[activeIndex];
        const template = document.getElementById("topic-" + card.dataset.topic);
        const count = String(activeIndex + 1).padStart(2, "0");
        popup.style.setProperty("--modal-accent", getComputedStyle(card).getPropertyValue("--a").trim() || "#f45d50");
        title.textContent = card.dataset.title;
        indexLabel.textContent = "MATERI " + count + " / " + totalLabel;
        progress.textContent = count + " / " + totalLabel;
        body.replaceChildren(template.content.cloneNode(true));
        body.scrollTop = 0;
        bindCommission();
        if (initial) closeButton.focus();
      }
      function openIndex(i) {
        if (overlay.hidden) returnFocus = document.activeElement;
        overlay.hidden = false;
        document.body.classList.add("modal-open");
        showIndex(i, true);
      }
      function close() {
        overlay.hidden = true;
        document.body.classList.remove("modal-open");
        if (returnFocus && typeof returnFocus.focus === "function") returnFocus.focus();
      }
      cards.forEach(function (card, i) { card.addEventListener("click", function () { openIndex(i); }); });
      closeButton.addEventListener("click", close);
      shade.addEventListener("click", close);
      prev.addEventListener("click", function () { showIndex(activeIndex - 1, false); });
      next.addEventListener("click", function () { showIndex(activeIndex + 1, false); });
      body.addEventListener("click", function (event) {
        const button = event.target.closest("[data-open-topic]");
        if (!button) return;
        const i = cards.findIndex(function (card) { return card.dataset.topic === button.dataset.openTopic; });
        if (i >= 0) showIndex(i, false);
      });
      document.addEventListener("keydown", function (event) {
        if (overlay.hidden) return;
        if (event.key === "Escape") { event.preventDefault(); close(); return; }
        if (event.key !== "Tab") return;
        const focusable = Array.from(overlay.querySelectorAll("button:not([disabled]), a[href], summary, [tabindex]:not([tabindex='-1'])")).filter(function (el) { return el.getClientRects().length > 0; });
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
    })();
  </script>
</body>
</html>
