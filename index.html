<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <title>Portfolio Series — Coming Soon</title>
    <meta name="description" content="Portfolio Series by Cuanify. Coming soon." />
    <meta property="og:title" content="Portfolio Series — Coming Soon" />
    <meta property="og:description" content="Portfolio Series by Cuanify. Coming soon." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: Inter, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: #07070a; color: #f4f1ec; }
      main { position: relative; display: flex; min-height: 100svh; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 48px 20px; text-align: center; isolation: isolate; }
      main::before { content: ''; position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse 50% 45% at 50% 53%, rgba(229,19,43,.20), transparent 76%); }
      .eyebrow { margin: 0 0 20px; font-size: 11px; font-weight: 700; letter-spacing: .42em; color: #ff3d5a; }
      h1 { margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-size: clamp(84px, 20vw, 220px); font-weight: 400; line-height: .8; letter-spacing: .02em; text-shadow: 0 20px 80px #0008; }
      h1 span { color: #e5132b; }
      .line { height: 3px; width: 72px; margin-top: 32px; border-radius: 99px; background: #e5132b; box-shadow: 0 0 32px #e5132b88; }
      @media (prefers-reduced-motion: no-preference) { h1 { animation: reveal 1s both; } .line { animation: reveal 1s .3s both; } @keyframes reveal { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">PORTFOLIO SERIES</p>
      <h1>COMING<br />SOON<span>.</span></h1>
      <div class="line" aria-hidden="true"></div>
    </main>
  </body>
</html>
