name: Validasi PESONAFLIX
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:clients
      - run: npm run verify
  auto-publish-cms:
    name: auto-publish-cms
    needs: verify
    if: >-
      ${{ github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'cms/') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.body || '', 'PERSONALFLIX_CMS:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Terbitkan PR khusus PESONAFLIX CMS setelah semua tes lulus
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Jangan auto-merge perubahan kode, konfigurasi, atau klien lain.
          slug="${PR_BODY#PERSONALFLIX_CMS:}"
          slug="${slug%%$'\n'*}"
          [[ "${slug}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 1
          [[ "${PR_BRANCH}" == "cms/${slug}-"* ]] || exit 1
          client_json_count=0
          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | [.filename, .status] | @tsv')"
          while IFS=$'\t' read -r filename status; do
            [[ "${status}" != 'removed' ]] || exit 1
            if [[ "${filename}" == "src/data/clients/${slug}.json" ]]; then
              client_json_count=$((client_json_count + 1))
            elif [[ "${filename}" =~ ^public/clients/${slug}/[a-zA-Z0-9._-]+\.(png|jpe?g|webp|avif)$ ]]; then
              :
            else
              echo "Ditolak: file di luar folder klien: ${filename}"
              exit 1
            fi
          done <<< "${changed_files}"
          [[ "${client_json_count}" -eq 1 ]] || { echo 'Satu JSON klien diperlukan.'; exit 1; }
          gh api -X PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${PR_SHA}" \
            -f merge_method=squash \
            -f commit_title="Terbitkan otomatis PESONAFLIX CMS #${PR_NUMBER}"
  auto-publish-alias:
    name: auto-publish-alias
    needs: verify
    if: >-
      ${{ github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'cms/alias-') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.body || '', 'PERSONALFLIX_ALIAS:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Terbitkan perubahan link tanpa menyentuh konten klien
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          marker="${PR_BODY%%$'\n'*}"
          [[ "${marker}" =~ ^PERSONALFLIX_ALIAS:([a-z0-9]+(-[a-z0-9]+)*):([a-z0-9]+(-[a-z0-9]+)*)$ ]] || exit 1
          source_slug="${BASH_REMATCH[1]}"
          [[ "${PR_BRANCH}" == "cms/alias-${source_slug}-"* ]] || exit 1
          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | [.filename, .status] | @tsv')"
          [[ "${changed_files}" == $'src/data/clientAliases.json\tmodified' ]] || {
            echo 'Ditolak: perubahan link hanya boleh mengubah peta URL.'
            exit 1
          }
          gh api -X PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${PR_SHA}" \
            -f merge_method=squash \
            -f commit_title="Aktifkan link PESONAFLIX #${PR_NUMBER}"
