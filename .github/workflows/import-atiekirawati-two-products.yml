name: Temporary Atiek Two Product Images Import
on:
  push:
    branches:
      - cms/atiekirawati-steffi-bpnorway-20261126
    paths:
      - .github/workflows/import-atiekirawati-two-products.yml
permissions:
  contents: write
jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import two photos supplied by client
        shell: bash
        run: |
          set -euo pipefail
          folder="public/clients/atiekirawati"
          mkdir -p "$folder"
          curl --fail --location --silent --show-error --retry 3 \
            'https://www.dropbox.com/scl/fi/fdgw3njm7a19s5pj4wvc2/WhatsApp-Image-2026-11-26-at-09.45.47.jpeg?rlkey=azd9jzar9o4jb9gww75kxzy2g&dl=1' \
            -o "$folder/steffi.jpeg"
          curl --fail --location --silent --show-error --retry 3 \
            'https://www.dropbox.com/scl/fi/e13tophql8on0uabpnq4h/WhatsApp-Image-2026-11-26-at-09.47.12.jpeg?rlkey=gufconr6lpo2dy4kj0na23xgy&dl=1' \
            -o "$folder/bp-norway.jpeg"
          for image in "$folder/steffi.jpeg" "$folder/bp-norway.jpeg"; do
            file --mime-type "$image" | grep -q 'image/jpeg'
            test "$(wc -c < "$image")" -ge 10000
            test "$(wc -c < "$image")" -le 1000000
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$folder/steffi.jpeg" "$folder/bp-norway.jpeg"
          if ! git diff --cached --quiet; then
            git commit -m "asset(atiekirawati): add Steffi and BP Norway product photos"
            git push origin HEAD:cms/atiekirawati-steffi-bpnorway-20261126
          fi
